ign-items:center;color:var(--muted);font-size:13px;font-weight:700}.progress-track{max-width:650px;margin:0 auto 22px;height:7px;background:#e7ebe2;border-radius:9px;overflow:hidden}.progress-fill{background:#a8c772;height:100%;transition:width .2s}.flash-card{max-width:650px;width:100%;min-height:330px;margin:0 auto;border-radius:26px;background:#fff;box-shadow:0 14px 36px rgba(18,61,45,.08);border:1px solid #e4ebe2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:30px 20px;position:relative}.flash-card.is-flipped{background:#f1f8e6}.flash-lang{letter-spacing:1.6px;font-size:11px;font-weight:900;text-transform:uppercase;color:#93a69b}.flash-word{font-size:clamp(28px,5.5vw,45px);letter-spacing:-1.4px;line-height:1.2;font-weight:900;overflow-wrap:anywhere}.flash-example{font-size:14px;color:#527b60;max-width:390px;line-height:1.6}.flash-sub{color:#8aa398;font-size:13px}.flash-bottom{text-align:center;margin:19px auto;max-width:650px}.review-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.grade-btn{border-radius:13px;border:1px solid var(--line);background:#fff;padding:13px 6px;font-size:12px;font-weight:820;min-height:63px}.grade-btn small{display:block;font-size:10px;font-weight:650;color:#85958d;margin-top:5px}.grade-btn.again{background:#fff0ec;color:#b75949}.grade-btn.hard{background:#fff3df;color:#a17b41}.grade-btn.good{background:#edf6e1;color:#477e44}.grade-btn.easy{background:#d8edb7;color:#315d43}.quiz-options{max-width:650px;margin:17px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.quiz-option{padding:18px 14px;min-height:72px;border:1px solid #dce8d9;background:white;border-radius:15px;color:var(--ink);font-weight:800;text-align:center;overflow-wrap:anywhere}.quiz-option:hover:not(:disabled){background:#f2f9e7}.quiz-option.correct{border-color:#72ae68;background:#e2f5da}.quiz-option.wrong{border-color:#e6a393;background:#fff0ec}.answer-box{max-width:650px;margin:18px auto 0;padding:16px;background:#eff5e8;border-radius:15px;font-size:14px;line-height:1.55}.answer-box.wrong{background:#fff1eb}.quiz-result{text-align:center;margin:22px auto;max-width:650px;padding-bottom:100px}.results{max-width:570px;margin:auto;text-align:center;padding:40px 30px}.results .big{font-size:55px;margin:4px 0}.results h2{font-size:29px;letter-spacing:-.8px}.results p{color:var(--ink2)}.setting-row{padding:20px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-row h3{font-size:16px;margin:0 0 7px}.setting-row p{font-size:13px;color:var(--muted);line-height:1.65;margin:0 0 12px}.notice{background:#eff5e4;border-radius:14px;padding:14px;font-size:13px;line-height:1.6;color:#4d7060}.bottom-nav{display:none}
    dialog{border:0;border-radius:23px;padding:0;width:min(95vw,500px);max-height:calc(100dvh - 40px);box-shadow:0 24px 100px rgba(13,38,31,.28);color:var(--ink)}dialog::backdrop{background:rgba(15,47,39,.45);backdrop-filter:blur(4px)}.dialog-body{padding:25px;overflow-y:auto;max-height:calc(100dvh - 50px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}.dialog-head h2{margin:0;font-size:22px;letter-spacing:-.7px}.dialog-buttons{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:9px;margin-top:16px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#143d36;color:white;border-radius:13px;box-shadow:0 10px 30px #183c382f;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s;text-align:center;font-size:13px;font-weight:720;max-width:90vw}.toast.show{opacity:1}
    @media(max-width:760px){.container{padding:0 16px}.top-inner{min-height:66px}.desktop-nav{display:none}.topbar{position:static}.brand-name{font-size:17px}.brand-caption{font-size:10px}main{padding-top:18px;padding-bottom:calc(98px + env(safe-area-inset-bottom))}.hero{min-height:225px;padding:25px 22px;border-radius:23px}.hero h1{font-size:32px}.hero-art{min-width:120px}.art-card{width:117px;height:144px;padding:16px 12px;border-radius:15px}.art-card strong{font-size:23px}.art-card span{font-size:21px}.hero p{font-size:13px}.stats{gap:8px;margin:14px 0 25px}.stat{padding:13px 10px;display:block;text-align:center}.stat-icon{width:34px;height:34px;margin:0 auto 5px;font-size:16px}.stat-number{font-size:22px}.stat-label{font-size:10px}.deck-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.deck-tile{padding:15px;min-height:172px}.deck-tile h3{font-size:15px}.bottom-nav{display:flex;position:fixed;z-index:30;bottom:0;left:0;right:0;justify-content:space-around;gap:3px;background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 5px calc(8px + env(safe-area-inset-bottom))}.bottom-link{flex:1;border:0;background:transparent;color:#879c91;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:9px;font-weight:800;padding:5px 0;max-width:90px}.bottom-link .bicon{font-size:20px;line-height:1}.bottom-link.active{color:#234c40}.bottom-link.active .bicon{transform:translateY(-1px)}.section-header h1{font-size:27px}}
    @media(max-width:450px){.hero-art{display:none}.hero{min-height:235px}.hero h1{font-size:34px}.word-pair{grid-template-columns:1fr 19px 1fr}.word-row{padding:12px 10px;gap:8px}.word-pair strong{font-size:13px}.row-actions{gap:4px}.icon-btn{width:30px;height:32px}.form-layout{grid-template-columns:1fr;gap:0}.review-buttons{gap:5px}.grade-btn{font-size:11px;padding:9px 3px}.quiz-options{grid-template-columns:1fr}.quiz-option{min-height:57px}.flash-card{min-height:280px}.section-header{align-items:flex-start}.section-header .btn{font-size:12px;padding:10px}}

<body>
  <header class="topbar"><div class="container top-inner">
    <button class="brand" data-nav="home" aria-label="Aller à l’accueil"><span class="logo">¡</span><span class="brand-text"><span class="brand-name">Español Flash</span><span class="brand-caption">Un poquito cada día</span></span></button>
    <nav class="desktop-nav" id="desktop-nav" aria-label="Navigation principale"></nav>
  </div></header>
  <main class="container" id="app" aria-live="polite"></main>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navigation mobile"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="deck-dialog"><form id="deck-form" class="dialog-body"><div class="dialog-head"><h2 id="deck-form-title">Créer une liste</h2><button type="button" class="icon-btn" data-close="deck-dialog" aria-label="Fermer">×</button></div>
    <input type="hidden" name="deckId" /><div class="field"><label for="deck-title">Nom de la liste</label><input class="input" id="deck-title" name="title" placeholder="Ex. : Verbes du quotidien" required maxlength="65" /></div>
    <div class="field"><label for="deck-description">Description (facultative)</label><input class="input" id="deck-description" name="description" placeholder="Ex. : Les verbes les plus fréquents" maxlength="140" /></div>
    <div class="dialog-buttons"><button type="button" class="btn btn-white" data-close="deck-dialog">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
  </form></dialog>

  <dialog id="card-dialog"><form id="card-form" class="dialog-body"><div class="dialog-head"><h2 id="card-form-title">Ajouter un mot</h2><button type="button" class="icon-btn" data-close="card-dialog" aria-label="Fermer">×</button></div>
    <input type="hidden" name="cardId" /><input type="hidden" name="deckId" />
    <div class="field"><label for="card-fr">En français</label><input class="input" id="card-fr" name="fr" required maxlength="180" placeholder="Ex. : se souvenir" /></div>
    <div class="field"><label for="card-es">En espagnol</label><input class="input" id="card-es" name="es" required maxlength="180" placeholder="Ex. : acordarse" autocapitalize="none" /></div>
    <div class="field"><label for="card-example">Exemple / note (facultatif)</label><textarea class="textarea" id="card-example" name="example" rows="2" maxlength="450" placeholder="Ex. : Me acuerdo de ti."></textarea></div>
    <div class="dialog-buttons"><button type="button" class="btn btn-white" data-close="card-dialog">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
  </form></dialog>

  <dialog id="bulk-dialog"><form id="bulk-form" class="dialog-body"><div class="dialog-head"><h2>Ajouter plusieurs mots</h2><button type="button" class="icon-btn" data-close="bulk-dialog" aria-label="Fermer">×</button></div>
    <input type="hidden" name="deckId" /><p class="hint">Un mot par ligne, séparé par un point-virgule ou une tabulation. Par exemple :</p>
    <div class="notice" style="white-space:pre-line;margin:10px 0 18px">bonjour ; hola
maison ; casa
apprendre ; aprender</div>
    <div class="field"><label for="bulk-text">Tes mots</label><textarea class="textarea" id="bulk-text" name="bulkText" rows="8" required placeholder="mot français ; palabra española"></textarea></div>
    <div class="dialog-buttons"><button type="button" class="btn btn-white" data-close="bulk-dialog">Annuler</button><button type="submit" class="btn btn-primary">Ajouter les mots</button></div>
  </form></dialog>
  <input type="file" id="import-file" accept=".json,application/json" hidden />

  <script>
  'use strict';
  // Toute la logique est intégrée dans ce fichier HTML : aucune dépendance ni publicité.
  const STORAGE_KEY = 'espanol-flash-v1';
  const DAY = 24 * 60 * 60 * 1000;
  const id = () => (globalThis.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
  const today = ts => new Date(ts).toDateString() === new Date().toDateString();
  const safe = value => String(value ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const shuffle = arr => { const out = [...arr]; for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];} return out; };
  const normalize = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().trim().replace(/[¿?¡!.,;:]/g,'').replace(/\s+/g,' ');
  const defaultDecks = () => {
    const deckId = id();
    const pairs = [
      ['bonjour','hola','¡Hola! ¿Cómo estás?'],['merci','gracias','Muchas gracias.'],['s’il te plaît','por favor','Un café, por favor.'],
      ['apprendre','aprender','Quiero aprender español.'],['la maison','la casa','Estoy en casa.'],['le travail','el trabajo','Voy al trabajo.'],
      ['aujourd’hui','hoy','Hoy tengo tiempo.'],['demain','mañana','Hasta mañana.'],['hier','ayer','Ayer estudié.'],
      ['je voudrais','me gustaría','Me gustaría viajar.'],['parce que','porque','Estudio porque me gusta.'],['se souvenir','acordarse','Me acuerdo de ti.'],
      ['le temps','el tiempo','No tengo tiempo.'],['toujours','siempre','Siempre llego temprano.'],['parfois','a veces','A veces cocino.']
    ];
    return { version:1, decks:[{id:deckId,title:'Pour commencer',description:'15 expressions utiles au quotidien',createdAt:Date.now()}], cards:pairs.map(([fr,es,example])=>({id:id(),deckId,fr,es,example,createdAt:Date.now(),dueAt:0,interval:0,ease:2.5,reps:0,lapses:0})), history:[] };
  };
  function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const data=JSON.parse(raw);if(data && Array.isArray(data.decks) && Array.isArray(data.cards))return {...data,history:Array.isArray(data.history)?data.history:[]};}}catch(e){console.warn('Erreur de lecture des données',e);}return defaultDecks();}
  let db=load(), view='home', selectedDeckId=null, searchTerm='', study=null, quiz=null;
  let toastTimer=null;
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));return true;}catch(e){showToast('Stockage indisponible : pense à exporter une sauvegarde.');return false;}}
  // Premier lancement : enregistrer la liste de démonstration.
  if(!localStorage.getItem(STORAGE_KEY))save();
  const getDeck=id=>db.decks.find(d=>d.id===id);
  const deckCards=id=>db.cards.filter(c=>c.deckId===id);
  const isDue=c=>(Number(c.dueAt)||0)<=Date.now();
  const dueCount=deckId=>db.cards.filter(c=>(!deckId||c.deckId===deckId)&&isDue(c)).length;
  const totalCorrectToday=()=>db.history.filter(h=>h.correct===true&&today(h.ts)).length;
  function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3100);}
  const menu=[['home','⌂','Accueil'],['decks','▤','Listes'],['study','◈','Réviser'],['quiz','✦','Quiz'],['backup','⚙','Données']];
  function renderNav(){document.getElementById('desktop-nav').innerHTML=menu.map(([key,icon,label])=>`<button class="nav-link ${view===key?'active':''}" data-nav="${key}">${label}</button>`).join('');document.getElementById('bottom-nav').innerHTML=menu.map(([key,icon,label])=>`<button class="bottom-link ${view===key?'active':''}" data-nav="${key}" aria-label="${label}"><span class="bicon">${icon}</span><span>${label}</span></button>`).join('');}
  function navigate(next){view=next;if(next!=='study')study=null;if(next!=='quiz')quiz=null;render();window.scrollTo({top:0,behavior:'instant'});}
  function sectionTitle(kicker,title,subtitle=''){return `<div class="eyebrow">${kicker}</div><div class="section-header"><div><h1>${title}</h1>${subtitle?`<p class="sub">${subtitle}</p>`:''}</div></div>`;}

  function homeHTML(){const due=dueCount();return `<section class="hero"><div class="hero-copy"><div class="eyebrow">✦ Apprends chaque jour</div><h1>Un mot de plus,<br>un pas de plus. 🌿</h1><p>Crée tes listes, entraîne ta mémoire et progresse en espagnol, à ton rythme.</p><div class="actions"><button class="btn btn-light" data-nav="study">${due?`Réviser mes ${due} mot${due>1?'s':''}`:'Ouvrir mes révisions'} ↗</button><button class="btn btn-white" data-nav="quiz">Lancer un quiz</button></div></div><div class="hero-art" aria-hidden="true"><div class="art-card"><small>PALABRA DEL DÍA</small><strong>¡Vamos!</strong><span>✳</span></div></div></section>
    <div class="stats"><div class="stat card-panel"><span class="stat-icon">📖</span><div><div class="stat-number">${db.cards.length}</div><div class="stat-label">Mes mots</div></div></div><div class="stat card-panel"><span class="stat-icon">🗓️</span><div><div class="stat-number">${due}</div><div class="stat-label">À réviser</div></div></div><div class="stat card-panel"><span class="stat-icon">✨</span><div><div class="stat-number">${totalCorrectToday()}</div><div class="stat-label">Réussites aujourd'hui</div></div></div></div>

  function emptyHTML(title,description,action,label){return `<div class="empty"><div class="empty-emoji">🌱</div><h3>${title}</h3><p>${description}</p>${action?`<button class="btn btn-primary" data-action="${action}">${label}</button>`:''}</div>`;}
  function decksHTML(){if(!selectedDeckId||!getDeck(selectedDeckId)){return `${sectionTitle('Mon vocabulaire','Mes listes','Organise les mots par thème, leçon ou niveau.')}<div class="toolbar"><span class="hint">${db.decks.length} liste${db.decks.length>1?'s':''}</span><button class="btn btn-primary" data-action="new-deck">+ Nouvelle liste</button></div>${db.decks.length?`<div class="deck-grid">${db.decks.map(deckTile).join('')}</div>`:emptyHTML('Aucune liste','Commence par créer ta première liste.','new-deck','Créer une liste')}`;}
    const d=getDeck(selectedDeckId);const cards=deckCards(d.id);const visible=cards.filter(c=>(c.fr+' '+c.es+' '+c.example).toLocaleLowerCase().includes(searchTerm.toLocaleLowerCase()));return `<button class="btn btn-soft" data-action="back-decks" style="margin-bottom:20px">← Toutes mes listes</button>
    <div class="eyebrow">✦ ${cards.length} mot${cards.length>1?'s':''}</div><div class="section-header"><div><h1>${safe(d.title)}</h1><p class="sub">${safe(d.description||'Ma liste personnelle')}</p></div></div>
    <div class="toolbar"><div class="actions"><button class="btn btn-primary" data-action="new-card" data-id="${safe(d.id)}">+ Ajouter un mot</button><button class="btn btn-soft" data-action="bulk" data-id="${safe(d.id)}">+ Coller une liste</button></div><div class="actions"><button class="btn btn-white" data-action="edit-deck" data-id="${safe(d.id)}">Renommer</button><button class="btn btn-red" data-action="delete-deck" data-id="${safe(d.id)}">Supprimer</button></div></div>
    ${cards.length?`<div class="toolbar"><input class="input" id="word-search" aria-label="Rechercher un mot" placeholder="🔎 Rechercher un mot…" value="${safe(searchTerm)}" /><span class="hint">${visible.length} résultat${visible.length>1?'s':''} · ${dueCount(d.id)} à réviser</span></div><div class="word-list" id="word-list">${visible.map(wordRow).join('')}</div>`:emptyHTML('Cette liste est vide','Ajoute un mot ou colle plusieurs traductions à la fois.','new-card','Ajouter un mot')}`;}
  function wordRow(c){return `<div class="word-row"><div class="word-pair"><div><strong>${safe(c.fr)}</strong><div class="meta">Français</div></div><span>→</span><div><strong>${safe(c.es)}</strong><div class="meta">Espagnol ${c.reps>0?'· '+(isDue(c)?'à revoir':'révisé'):'· nouveau'}</div></div></div><div class="row-actions"><button class="icon-btn" data-action="speak" data-id="${safe(c.id)}" title="Écouter en espagnol" aria-label="Écouter">♪</button><button class="icon-btn" data-action="edit-card" data-id="${safe(c.id)}" title="Modifier" aria-label="Modifier">✎</button><button class="icon-btn danger" data-action="delete-card" data-id="${safe(c.id)}" title="Supprimer" aria-label="Supprimer">×</button></div></div>`;}
  const dropdown=(id)=>db.decks.map(d=>`<option value="${safe(d.id)}" ${id===d.id?'selected':''}>${safe(d.title)} (${deckCards(d.id).length})</option>`).join('');
  function studyHTML(){if(study){if(study.queue.length===0)return resultsHTML('Révisions terminées !','Toutes les cartes de cette séance ont été travaillées.','study',study.answers,study.correct);const c=db.cards.find(x=>x.id===study.queue[0]);if(!c){study.queue.shift();return studyHTML();}const frenchFirst=study.direction==='fr-es';const question=frenchFirst?c.fr:c.es;const answer=frenchFirst?c.es:c.fr;const before=study.answers;return `${sectionTitle('Répétition espacée','Mes révisions')}<div class="session-top"><span>Carte ${before+1} · ${study.queue.length} restante${study.queue.length>1?'s':''}</span><button class="btn btn-white" data-action="exit-study">Quitter</button></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,Math.round((study.done.size/Math.max(1,study.initialCount))*100))}%"></div></div>
      <div class="flash-card ${study.flipped?'is-flipped':''}"><div class="flash-lang">${frenchFirst?'Français':'Espagnol'}</div><div class="flash-word">${safe(question)}</div>${study.flipped?`<div class="flash-lang">${frenchFirst?'En espagnol':'En français'}</div><div class="flash-word" style="color:#56845b">${safe(answer)}</div>${c.example?`<div class="flash-example">${safe(c.example)}</div>`:''}`:'<div class="flash-sub">Essaie de retrouver la traduction…</div>'}${frenchFirst&&study.flipped?`<button class="btn btn-soft" data-action="speak" data-id="${safe(c.id)}">♪ Écouter l’espagnol</button>`:''}</div>
      <div class="flash-bottom">${!study.flipped?`<button class="btn btn-primary" style="width:100%" data-action="flip">Voir la réponse</button>`:`<div class="hint">À quel point connaissais-tu ce mot ?</div><div class="review-buttons"><button class="grade-btn again" data-grade="again">À revoir<small>1 min</small></button><button class="grade-btn hard" data-grade="hard">Difficile<small>1 jour</small></button><button class="grade-btn good" data-grade="good">Bien<small>Progression</small></button><button class="grade-btn easy" data-grade="easy">Facile<small>Plus tard</small></button></div>`}</div>`;}
    return `${sectionTitle('Répétition espacée','Réviser mes mots','Retourne les cartes puis évalue ta mémoire : les mots difficiles reviendront plus souvent.')}<div class="card-panel selector-card"><form id="study-start-form"><div class="field"><label for="study-deck">Quelle liste réviser ?</label><select id="study-deck" class="select" name="deck" required>${dropdown(selectedDeckId||db.decks[0]?.id)}</select></div><div class="field"><label>Quelles cartes ?</label><div class="options-grid"><label class="choice"><input type="radio" name="scope" value="due" checked />À réviser aujourd'hui</label><label class="choice"><input type="radio" name="scope" value="all" />Toutes les cartes</label></div></div><div class="field"><label>Sens de la traduction</label><div class="options-grid"><label class="choice"><input type="radio" name="direction" value="fr-es" checked />Français → Espagnol</label><label class="choice"><input type="radio" name="direction" value="es-fr" />Espagnol → Français</label></div></div><button class="btn btn-primary" style="width:100%;margin-top:7px" type="submit" ${!db.cards.length?'disabled':''}>Commencer les révisions</button><p class="hint">${dueCount()} carte${dueCount()>1?'s':''} à réviser actuellement, toutes listes confondues.</p></form></div>`;}
  function resultsHTML(title,description,section,answers,correct){return `<div class="results card-panel"><div class="big">🎉</div><h2>${title}</h2><p>${description}</p><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat card-panel"><div class="stat-number">${answers}</div><div class="stat-label">Réponses données</div></div><div class="stat card-panel"><div class="stat-number">${correct}</div><div class="stat-label">Réussites</div></div></div><div class="actions" style="justify-content:center"><button class="btn btn-primary" data-action="restart-${section}">Recommencer</button><button class="btn btn-white" data-nav="home">Accueil</button></div></div>`;}
  function quizHTML(){if(quiz){if(quiz.index>=quiz.ids.length)return resultsHTML('Quiz terminé !',`Tu as obtenu ${quiz.correct} bonne${quiz.correct>1?'s':''} réponse${quiz.correct>1?'s':''} sur ${quiz.ids.length}.`,'quiz',quiz.ids.length,quiz.correct);const c=db.cards.find(x=>x.id===quiz.ids[quiz.index]);if(!c){quiz.index++;return quizHTML();}const prompt=quiz.direction==='fr-es'?c.fr:c.es;const target=quiz.direction==='fr-es'?c.es:c.fr;return `${sectionTitle('Teste ta mémoire','Mon quiz')}<div class="session-top"><span>Question ${quiz.index+1} / ${quiz.ids.length}</span><button class="btn btn-white" data-action="exit-quiz">Quitter</button></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(quiz.index/quiz.ids.length*100)}%"></div></div><div class="flash-card" style="min-height:220px"><div class="flash-lang">${quiz.direction==='fr-es'?'Traduis en espagnol':'Traduis en français'}</div><div class="flash-word">${safe(prompt)}</div></div>
      ${quiz.mode==='qcm'?`<div class="quiz-options">${quiz.options.map(opt=>`<button class="quiz-option ${quiz.answered?(normalize(opt)===normalize(target)?'correct':normalize(opt)===normalize(quiz.response)?'wrong':''):''}" data-answer="${safe(opt)}" ${quiz.answered?'disabled':''}>${safe(opt)}</button>`).join('')}</div>`:`<form id="typed-answer-form" style="max-width:650px;margin:18px auto 0"><div class="field"><label for="typed-answer">Ta traduction</label><input id="typed-answer" name="typed" class="input" placeholder="Écris ta réponse…" autocomplete="off" autocapitalize="none" spellcheck="false" ${quiz.answered?'disabled':''} required /></div>${!quiz.answered?'<button type="submit" class="btn btn-primary" style="width:100%">Valider ma réponse</button>':''}</form>`}
      ${quiz.answered?`<div class="answer-box ${quiz.wasCorrect?'':'wrong'}"><strong>${quiz.wasCorrect?'✓ Bonne réponse !':'↻ À retenir :'}</strong> ${safe(target)}${!quiz.wasCorrect&&quiz.mode==='typed'?`<div>Tu as écrit : ${safe(quiz.response)}</div>`:''}${c.example?`<div style="margin-top:5px">${safe(c.example)}</div>`:''}</div><div class="quiz-result"><button class="btn btn-primary" style="min-width:210px" data-action="next-quiz">${quiz.index+1===quiz.ids.length?'Voir mon résultat':'Question suivante →'}</button></div>`:''}`;}
    return `${sectionTitle('Pratique active','Créer un quiz','Entraîne-toi avec des questions à choix multiples ou des traductions à écrire.')}<div class="card-panel selector-card"><form id="quiz-start-form"><div class="field"><label for="quiz-deck">Choisir une liste</label><select class="select" id="quiz-deck" name="deck" required>${dropdown(selectedDeckId||db.decks[0]?.id)}</select></div><div class="field"><label>Type de quiz</label><div class="options-grid"><label class="choice"><input type="radio" name="mode" value="qcm" checked />QCM</label><label class="choice"><input type="radio" name="mode" value="typed" />Écrire la réponse</label></div></div><div class="field"><label>Sens de la traduction</label><div class="options-grid"><label class="choice"><input type="radio" name="direction" value="fr-es" checked />Français → Espagnol</label><label class="choice"><input type="radio" name="direction" value="es-fr" />Espagnol → Français</label></div></div><p class="hint">Jusqu'à 10 questions par quiz. En réponse écrite, les accents et majuscules sont tolérés. Les quiz n'avancent pas les dates des cartes de révision.</p><button class="btn btn-primary" type="submit" style="width:100%" ${!db.cards.length?'disabled':''}>Démarrer le quiz</button></form></div>`;}
  function backupHTML(){return `${sectionTitle('Mes données','Sauvegardes et installation','Tes listes restent sur cet appareil. Aucun compte ni abonnement n’est nécessaire.')}<div class="card-panel" style="max-width:720px">
    <div class="setting-row"><h3>📦 Exporter mes listes et mes progrès</h3><p>Télécharge un fichier <strong>.json</strong> qui contient les listes, les mots, les statistiques et les prochaines révisions. À conserver dans Fichiers, iCloud Drive ou ailleurs.</p><button class="btn btn-primary" data-action="export">↓ Télécharger une sauvegarde</button></div>
    <div class="setting-row"><h3>📥 Restaurer une sauvegarde</h3><p>Importe un fichier JSON exporté par Español Flash. <strong>Attention :</strong> cela remplace toutes les listes présentes sur cet appareil.</p><button class="btn btn-white" data-action="import">↑ Importer un fichier JSON</button></div>
    <div class="setting-row"><h3>📱 Ajouter l’application sur iPhone</h3><p>Ouvre l’adresse de ton application dans <strong>Safari</strong>, touche le bouton de partage, choisis <strong>« Sur l’écran d’accueil »</strong>, puis <strong>« Ajouter »</strong>. Si l’option apparaît, active « Ouvrir comme app web ».</p><div class="notice">Pour installer l’application avec une icône et un mode hors ligne fiable, ses fichiers doivent être publiés sur une adresse HTTPS (par exemple avec GitHub Pages, gratuitement).</div></div>
    <div class="setting-row"><h3>🔒 Respect de la vie privée</h3><p>Pas de connexion, pas de publicité et pas d’envoi de tes listes à un serveur. Le contenu est sauvegardé localement dans le navigateur / l’application. Les données peuvent disparaître si tu effaces les données du site ou supprimes l’application.</p><p><strong>Conseil :</strong> exporte régulièrement une sauvegarde, notamment avant de changer d’iPhone ou de réinstaller l’application.</p></div>
  </div>`;}
  function render(){renderNav();document.getElementById('app').innerHTML=view==='home'?homeHTML():view==='decks'?decksHTML():view==='study'?studyHTML():view==='quiz'?quizHTML():backupHTML();}
  function openDeckDialog(deckId=null){const d=deckId?getDeck(deckId):null;const form=document.getElementById('deck-form');form.reset();form.elements.deckId.value=d?.id||'';form.elements.title.value=d?.title||'';form.elements.description.value=d?.description||'';document.getElementById('deck-form-title').textContent=d?'Modifier la liste':'Créer une liste';document.getElementById('deck-dialog').showModal();}
  function openCardDialog(cardId=null,deckId=null){const c=cardId?db.cards.find(x=>x.id===cardId):null;const form=document.getElementById('card-form');form.reset();form.elements.cardId.value=c?.id||'';form.elements.deckId.value=c?.deckId||deckId||selectedDeckId||db.decks[0]?.id||'';form.elements.fr.value=c?.fr||'';form.elements.es.value=c?.es||'';form.elements.example.value=c?.example||'';document.getElementById('card-form-title').textContent=c?'Modifier un mot':'Ajouter un mot';document.getElementById('card-dialog').showModal();}
  function openBulkDialog(deckId){const form=document.getElementById('bulk-form');form.reset();form.elements.deckId.value=deckId;document.getElementById('bulk-dialog').showModal();}
  function speak(text){if(!('speechSynthesis' in window)){showToast('Lecture vocale non disponible ici.');return;}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.86;window.speechSynthesis.speak(u);}catch(e){showToast('Impossible de lire le mot à voix haute.');}}
  function logAnswer(cardId,correct,mode){db.history.push({ts:Date.now(),cardId,correct,mode});if(db.history.length>5000)db.history=db.history.slice(-5000);}
  function schedule(c,grade){let interval=Number(c.interval)||0;let ease=Number(c.ease)||2.5;
    if(grade==='again'){interval=1/1440;ease=Math.max(1.3,ease-.2);c.lapses=(c.lapses||0)+1;}
    else if(grade==='hard'){interval=Math.max(1,Math.round(interval*1.2));ease=Math.max(1.3,ease-.15);}
    else if(grade==='good'){interval=interval<1?1:Math.max(2,Math.round(interval*ease));}
    else if(grade==='easy'){interval=interval<1?4:Math.max(4,Math.round(interval*(ease+.8)));ease+=.15;}
    c.interval=interval;c.ease=ease;c.reps=(c.reps||0)+1;c.dueAt=Date.now()+interval*DAY;
  }
  function startStudy(form){const deckId=form.elements.deck.value,scope=form.elements.scope.value,direction=form.elements.direction.value;const cards=deckCards(deckId).filter(c=>scope==='all'||isDue(c));if(!cards.length){showToast(scope==='due'?'Aucun mot à réviser : sélectionne « Toutes les cartes ».':'Cette liste est vide.');return;}study={queue:shuffle(cards.map(c=>c.id)),initialCount:cards.length,done:new Set(),flipped:false,deckId,scope,direction,answers:0,correct:0,retries:{}};render();}
  function gradeStudy(grade){if(!study||!study.flipped||!study.queue.length)return;const cardId=study.queue.shift();const c=db.cards.find(x=>x.id===cardId);if(c){schedule(c,grade);logAnswer(cardId,grade==='good'||grade==='easy','study');if(grade==='again'&&(study.retries[cardId]||0)<2){study.retries[cardId]=(study.retries[cardId]||0)+1;study.queue.push(cardId);}else study.done.add(cardId);}study.answers++;if(grade==='good'||grade==='easy')study.correct++;study.flipped=false;save();render();}
  function startQuiz(form){const deckId=form.elements.deck.value,mode=form.elements.mode.value,direction=form.elements.direction.value,cards=deckCards(deckId);if(!cards.length){showToast('Ajoute d’abord des mots à cette liste.');return;}if(mode==='qcm'&&new Set(cards.map(c=>normalize(direction==='fr-es'?c.es:c.fr))).size<2){showToast('Pour un QCM, ajoute au moins deux traductions différentes.');return;}quiz={ids:shuffle(cards.map(c=>c.id)).slice(0,10),pool:cards,deckId,mode,direction,index:0,answered:false,response:'',wasCorrect:false,correct:0,options:[]};generateOptions();render();}
  function generateOptions(){if(!quiz||quiz.index>=quiz.ids.length)return;const c=db.cards.find(x=>x.id===quiz.ids[quiz.index]);if(!c)return;const target=quiz.direction==='fr-es'?c.es:c.fr;const others=shuffle([...new Set(quiz.pool.filter(x=>x.id!==c.id).map(x=>quiz.direction==='fr-es'?x.es:x.fr))]).filter(x=>normalize(x)!==normalize(target));quiz.options=shuffle([target,...others.slice(0,3)]);}
  function answerQuiz(value){if(!quiz||quiz.answered)return;const c=db.cards.find(x=>x.id===quiz.ids[quiz.index]);if(!c)return;const target=quiz.direction==='fr-es'?c.es:c.fr;quiz.response=value;quiz.wasCorrect=normalize(value)===normalize(target);quiz.answered=true;if(quiz.wasCorrect)quiz.correct++;logAnswer(c.id,quiz.wasCorrect,'quiz');save();render();}
  function nextQuiz(){if(!quiz)return;quiz.index++;quiz.answered=false;quiz.response='';quiz.wasCorrect=false;generateOptions();render();}
  function exportJSON(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`espanol-flash-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);showToast('Sauvegarde préparée. Conserve bien ce fichier !');}
  function validateBackup(data){if(!data||!Array.isArray(data.decks)||!Array.isArray(data.cards)||data.decks.length>2000||data.cards.length>20000)return null;
    const decks=data.decks.filter(d=>d&&typeof d.id==='string'&&typeof d.title==='string').map(d=>({id:String(d.id).slice(0,180),title:d.title.slice(0,65),description:String(d.description||'').slice(0,140),createdAt:Number(d.createdAt)||Date.now()}));const ids=new Set(decks.map(d=>d.id));
    const cards=data.cards.filter(c=>c&&typeof c.id==='string'&&ids.has(c.deckId)&&typeof c.fr==='string'&&typeof c.es==='string').map(c=>({id:String(c.id).slice(0,180),deckId:c.deckId,fr:c.fr.slice(0,180),es:c.es.slice(0,180),example:String(c.example||'').slice(0,450),createdAt:Number(c.createdAt)||Date.now(),dueAt:Math.max(0,Number(c.dueAt)||0),interval:Math.max(0,Number(c.interval)||0),ease:Math.max(1.3,Number(c.ease)||2.5),reps:Math.max(0,Number(c.reps)||0),lapses:Math.max(0,Number(c.lapses)||0)}));
    const history=Array.isArray(data.history)?data.history.slice(-5000).filter(h=>h&&Number.isFinite(Number(h.ts))).map(h=>({ts:Number(h.ts),cardId:String(h.cardId||'').slice(0,180),correct:h.correct===true,mode:String(h.mode||'study').slice(0,20)})):[];
    return {version:1,decks,cards,history};
  }
  document.addEventListener('click', e=>{
    const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}
    const close=e.target.closest('[data-close]');if(close){document.getElementById(close.dataset.close).close();return;}
    const answer=e.target.closest('[data-answer]');if(answer){answerQuiz(answer.dataset.answer);return;}
    const grade=e.target.closest('[data-grade]');if(grade){gradeStudy(grade.dataset.grade);return;}
    const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,cardId=btn.dataset.id;
    switch(action){
      case 'new-deck':openDeckDialog();break;
      case 'edit-deck':openDeckDialog(cardId);break;
      case 'open-deck':selectedDeckId=cardId;searchTerm='';navigate('decks');break;
      case 'back-decks':selectedDeckId=null;searchTerm='';render();break;
      case 'new-card':if(!db.decks.length){openDeckDialog();}else openCardDialog(null,cardId);break;
      case 'edit-card':openCardDialog(cardId);break;
      case 'bulk':openBulkDialog(cardId);break;
      case 'delete-deck':{const d=getDeck(cardId);if(!d||!confirm(`Supprimer la liste « ${d.title} » et tous ses mots ? Cette action est irréversible.`))break;db.decks=db.decks.filter(x=>x.id!==cardId);db.cards=db.cards.filter(x=>x.deckId!==cardId);selectedDeckId=null;save();render();showToast('Liste supprimée.');break;}
      case 'delete-card':{const c=db.cards.find(x=>x.id===cardId);if(!c||!confirm(`Supprimer « ${c.fr} / ${c.es} » ?`))break;db.cards=db.cards.filter(x=>x.id!==cardId);save();render();showToast('Mot supprimé.');break;}
      case 'flip':if(study){study.flipped=true;render();}break;
      case 'speak':{const c=db.cards.find(x=>x.id===cardId);if(c)speak(c.es);break;}
      case 'exit-study':study=null;render();break;
      case 'restart-study':study=null;render();break;
      case 'exit-quiz':quiz=null;render();break;
      case 'restart-quiz':quiz=null;render();break;
      case 'next-quiz':nextQuiz();break;
      case 'export':exportJSON();break;
      case 'import':document.getElementById('import-file').click();break;
    }
  });
  document.addEventListener('submit',e=>{
    const f=e.target;if(!['deck-form','card-form','bulk-form','study-start-form','quiz-start-form','typed-answer-form'].includes(f.id))return;e.preventDefault();
    if(f.id==='deck-form'){
      const deckId=f.elements.deckId.value,title=f.elements.title.value.trim(),description=f.elements.description.value.trim();if(!title)return;
      if(deckId){const d=getDeck(deckId);if(d){d.title=title;d.description=description;}}else{const newId=id();db.decks.push({id:newId,title,description,createdAt:Date.now()});selectedDeckId=newId;view='decks';}
      save();f.closest('dialog').close();render();showToast('Liste enregistrée.');
    }else if(f.id==='card-form'){
      const cardId=f.elements.cardId.value,deckId=f.elements.deckId.value,fr=f.elements.fr.value.trim(),es=f.elements.es.value.trim(),example=f.elements.example.value.trim();if(!fr||!es||!getDeck(deckId))return;
      if(cardId){const c=db.cards.find(x=>x.id===cardId);if(c){c.fr=fr;c.es=es;c.example=example;}}else db.cards.push({id:id(),deckId,fr,es,example,createdAt:Date.now(),dueAt:0,interval:0,ease:2.5,reps:0,lapses:0});
      save();f.closest('dialog').close();render();showToast('Mot enregistré.');
    }else if(f.id==='bulk-form'){
      const deckId=f.elements.deckId.value;let added=0,ignored=0;
      if(!getDeck(deckId))return;
      f.elements.bulkText.value.split(/\r?\n/).forEach(line=>{if(!line.trim())return;let parts=line.includes('\t')?line.split('\t'):line.split(';');if(parts.length<2){ignored++;return;}const fr=parts[0].trim().slice(0,180),es=parts.slice(1).join(';').trim().slice(0,180);if(!fr||!es){ignored++;return;}db.cards.push({id:id(),deckId,fr,es,example:'',createdAt:Date.now(),dueAt:0,interval:0,ease:2.5,reps:0,lapses:0});added++;});
      save();f.closest('dialog').close();render();showToast(`${added} mot${added>1?'s':''} ajouté${added>1?'s':''}${ignored?` · ${ignored} ligne(s) ignorée(s)`:''}.`);
    }else if(f.id==='study-start-form')startStudy(f);
    else if(f.id==='quiz-start-form')startQuiz(f);
    else if(f.id==='typed-answer-form'){answerQuiz(f.elements.typed.value);}
  });
  document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>12*1024*1024)throw new Error('Le fichier dépasse 12 Mo.');const parsed=validateBackup(JSON.parse(await f.text()));if(!parsed)throw new Error('Ce fichier n’est pas une sauvegarde valide.');if(!confirm(`Remplacer les données actuelles par cette sauvegarde (${parsed.decks.length} listes, ${parsed.cards.length} mots) ?`))return;db=parsed;selectedDeckId=null;searchTerm='';study=null;quiz=null;save();navigate('home');showToast('Sauvegarde restaurée !');}catch(err){showToast('Import impossible : '+err.message);}finally{e.target.value='';}});
  document.addEventListener('input',e=>{if(e.target.id==='word-search'){searchTerm=e.target.value;const rows=deckCards(selectedDeckId).filter(c=>(c.fr+' '+c.es+' '+c.example).toLocaleLowerCase().includes(searchTerm.toLocaleLowerCase()));document.getElementById('word-list').innerHTML=rows.map(wordRow).join('')||'<div class="empty"><p>Aucun mot trouvé.</p></div>';}});
  if('serviceWorker' in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.info('Hors-ligne non activé :',err)));
  render();
  </script>
</body>
</html>
